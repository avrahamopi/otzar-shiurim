name: wp-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python ingest/probe.py
      - run: |
          git config user.name "otzar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/wp_probe.json; git commit -m "WP probe results" || exit 0
          git pull --rebase -q && git push

name: discover-sources
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Yeshiva ids (space separated), empty = all"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scan podcasts and yeshiva websites
        run: python ingest/discover.py ${{ github.event.inputs.ids }}
      - name: Save results
        run: |
          git config user.name "otzar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/discovery.json
          git commit -m "Source discovery results" || exit 0
          git pull --rebase -q && git push
